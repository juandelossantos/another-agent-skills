# test-cadence.conf — single source of truth for the TASK-test working-set cap.
#
# Read by scripts/git-hooks/pre-commit (and, after
# `bash scripts/init-agents.sh sync-hooks`, by the installed .git/hooks/pre-commit).
# Behavioral/regression tests live in tests/ and are NOT counted; only the
# working set in tests/task/*.sh counts against this cap.
#
# Cadence (see docs/TEST-CADENCE.md):
#   hit MAX_TASK_TESTS -> push + full review
#                      -> git mv tests/task/<batch> tests/archived/<phase>/
#                      -> reset the working set
MAX_TASK_TESTS=20
