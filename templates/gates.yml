# gates.yml — Remote Enforcement (L2 authority layer)
# Installed by init-agents (another-agent-skills)
#
# This is the workflow whose job is named `gates`. Branch protection requires
# that check, so nothing merges into main without passing it. Local hooks
# (.git/hooks/*) are fast feedback for a cooperative agent, but they are
# writable — `core.hooksPath` can be repointed and the hook files can be edited.
# This workflow is enforced by GitHub and cannot be skipped by the committer.
#
# It runs your project's gates from STACK_CONFIG.md (test / lint / type check /
# build) and, if present, the AAS project audit (scripts/audit-project.sh).
#
# Turn on the remote layer (once per repo, needs `gh` + admin):
#   bash scripts/setup-branch-protection.sh --dry-run   # preview the payload
#   bash scripts/setup-branch-protection.sh             # apply to main
#
# Spec: PLAN.md — Phase 8 / P8.6

name: gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least privilege: the gates only read the repository.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read gates from STACK_CONFIG.md
        id: stack
        run: |
          if [ ! -f "STACK_CONFIG.md" ]; then
            echo "❌ No STACK_CONFIG.md found."
            echo ""
            echo "Run init-agents to create it:"
            echo "  bash init-agents.sh"
            echo ""
            echo "Or create STACK_CONFIG.md manually with your commands:"
            echo "  | Test | \`your-test-command\` |"
            exit 1
          fi

          # `|| true` keeps `set -e` (the Actions default shell) from aborting
          # the step when a row is absent, so the friendly check below runs.
          TEST_CMD=$(grep -E "^\| Test \|" STACK_CONFIG.md | sed 's/.*`\([^`]*\)`.*/\1/' | head -1 || true)
          LINT_CMD=$(grep -E "^\| Lint \|" STACK_CONFIG.md | sed 's/.*`\([^`]*\)`.*/\1/' | head -1 || true)
          BUILD_CMD=$(grep -E "^\| Build \|" STACK_CONFIG.md | sed 's/.*`\([^`]*\)`.*/\1/' | head -1 || true)
          TYPECHECK_CMD=$(grep -E "^\| Type check \|" STACK_CONFIG.md | sed 's/.*`\([^`]*\)`.*/\1/' | head -1 || true)

          [[ "$TEST_CMD" == *"<configure:"* ]] && TEST_CMD=""
          [[ "$LINT_CMD" == *"<configure:"* ]] && LINT_CMD=""
          [[ "$BUILD_CMD" == *"<configure:"* ]] && BUILD_CMD=""
          [[ "$TYPECHECK_CMD" == *"<configure:"* ]] && TYPECHECK_CMD=""

          if [[ -z "$TEST_CMD" && -z "$LINT_CMD" && -z "$BUILD_CMD" && -z "$TYPECHECK_CMD" ]]; then
            echo "⚠️ STACK_CONFIG.md has no configured commands."
            echo ""
            echo "Edit STACK_CONFIG.md and replace <configure: ...> with your actual commands:"
            echo "  | Test | \`npm test\` |"
            exit 1
          fi

          # Quote $GITHUB_OUTPUT (path with spaces) — values are single-line
          # commands from a markdown table cell, so no delimiter is needed.
          {
            echo "test_cmd=$TEST_CMD"
            echo "lint_cmd=$LINT_CMD"
            echo "build_cmd=$BUILD_CMD"
            echo "typecheck_cmd=$TYPECHECK_CMD"
          } >> "$GITHUB_OUTPUT"

          echo "📋 Running: test=${TEST_CMD:-none} lint=${LINT_CMD:-none} build=${BUILD_CMD:-none} typecheck=${TYPECHECK_CMD:-none}"

      # Add your setup steps here if needed:
      # - name: Setup Node
      #   uses: actions/setup-node@v4
      #   with:
      #     node-version: '20'

      # Commands come from STACK_CONFIG.md, which a pull request can edit. Never
      # interpolate them into `run:` with `${{ }}` — that is GitHub's documented
      # script-injection sink. Pass the value through an environment variable
      # instead, then hand it to bash as data (not generated script).
      - name: Run tests
        if: steps.stack.outputs.test_cmd != ''
        env:
          GATES_CMD: ${{ steps.stack.outputs.test_cmd }}
        run: bash -c "$GATES_CMD"

      - name: Run linter
        if: steps.stack.outputs.lint_cmd != ''
        env:
          GATES_CMD: ${{ steps.stack.outputs.lint_cmd }}
        run: bash -c "$GATES_CMD"

      - name: Run type check
        if: steps.stack.outputs.typecheck_cmd != ''
        env:
          GATES_CMD: ${{ steps.stack.outputs.typecheck_cmd }}
        run: bash -c "$GATES_CMD"

      - name: Run build
        if: steps.stack.outputs.build_cmd != ''
        env:
          GATES_CMD: ${{ steps.stack.outputs.build_cmd }}
        run: bash -c "$GATES_CMD"

      - name: AAS project audit (if installed)
        run: |
          if [ -x scripts/audit-project.sh ]; then
            bash scripts/audit-project.sh
          else
            echo "No scripts/audit-project.sh — skipping the AAS audit."
          fi
