# release.yml — Pinned, attested releases (Phase 9 / P9.1)
# Part of another-agent-skills (github.com/juandelossantos/another-agent-skills)
#
# On every `v*` tag: build the source tarball + checksums.txt, attest build
# provenance, and publish them as GitHub Release assets. bootstrap.sh installs
# from exactly these assets (pinned tag, sha256-verified) — never from `main`.
#
# After the release is published, an OPTIONAL step regenerates the Homebrew
# formula (scripts/build-brew-formula.sh) and pushes it to the tap repo. It is
# gated on the HOMEBREW_TAP_TOKEN secret: when the secret is absent the step is
# skipped and the release is unaffected. The tap repo defaults to
# juandelossantos/homebrew-tap and can be overridden with the
# HOMEBREW_TAP_REPO repository variable.
#
# Asset naming is the single source of truth in scripts/lib/aas.sh
# (aas_asset_name): another-agent-skills-v<version>.tar.gz + checksums.txt.

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (vX.Y.Z)'
        required: true

permissions:
  contents: write        # create the release + upload assets
  id-token: write        # OIDC for the attestation
  attestations: write    # write the build provenance attestation

jobs:
  release:
    runs-on: ubuntu-latest
    # Secrets cannot be referenced in `if:`; expose the optional tap token as a
    # job-level env so the Homebrew step can be gated on it (empty when unset).
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve tag
        id: tag
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag }}"
          [ -n "$TAG" ] || TAG="${{ github.ref_name }}"
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) : ;;
            *) echo "tag must be vX.Y.Z (got '$TAG')" >&2; exit 2 ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build the release tarball + checksums
        run: bash scripts/build-release.sh "${{ steps.tag.outputs.tag }}" dist

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/another-agent-skills-*.tar.gz

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          gh release create "$TAG" \
            "dist/another-agent-skills-${TAG#v}.tar.gz" \
            dist/checksums.txt \
            --title "$TAG" \
            --generate-notes

      # Optional: keep the Homebrew tap in sync with the release. Skipped (and
      # the release still succeeds) when HOMEBREW_TAP_TOKEN is not configured.
      - name: Update Homebrew tap (optional)
        if: ${{ env.HOMEBREW_TAP_TOKEN != '' }}
        env:
          HOMEBREW_TAP_REPO: ${{ vars.HOMEBREW_TAP_REPO }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "${HOMEBREW_TAP_TOKEN:-}" ]; then
            echo "HOMEBREW_TAP_TOKEN not set — skipping Homebrew tap update (release unaffected)."
            exit 0
          fi
          TAP_REPO="${HOMEBREW_TAP_REPO:-juandelossantos/homebrew-tap}"
          bash scripts/build-brew-formula.sh "$TAG" dist dist
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/${TAP_REPO}.git" tap
          mkdir -p tap/Formula
          cp dist/another-agent-skills.rb tap/Formula/another-agent-skills.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/another-agent-skills.rb
          if git diff --cached --quiet; then
            echo "Homebrew formula already up to date — nothing to push."
            exit 0
          fi
          git commit -m "another-agent-skills ${TAG}"
          git push origin HEAD
