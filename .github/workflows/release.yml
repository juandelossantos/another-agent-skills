# release.yml — Pinned, attested releases (Phase 9 / P9.1)
# Part of another-agent-skills (github.com/juandelossantos/another-agent-skills)
#
# On every `v*` tag: build the source tarball + a self-contained bootstrap.sh +
# checksums.txt, attest build provenance, and publish them as GitHub Release
# assets. bootstrap.sh installs from exactly these assets (pinned tag,
# sha256-verified) — never from `main`.
#
# Asset naming is the single source of truth in scripts/lib/aas.sh
# (aas_asset_name): another-agent-skills-v<version>.tar.gz + checksums.txt.

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (vX.Y.Z)'
        required: true

permissions:
  contents: write        # create the release + upload assets
  id-token: write        # OIDC for the attestation
  attestations: write    # write the build provenance attestation

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # workflow_dispatch: check out the requested tag so build-release can
          # archive exactly that ref; tag pushes fall back to github.ref.
          ref: ${{ github.event.inputs.tag || github.ref }}

      # Untrusted contexts (a dispatch input, a ref name) are passed through
      # `env`, never interpolated into the script body: `${{ }}` is expanded
      # before bash parses, so direct interpolation would allow shell injection.
      - name: Resolve tag
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-}"
          [ -n "$TAG" ] || TAG="$REF_NAME"
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) : ;;
            *) echo "tag must be vX.Y.Z (got '$TAG')" >&2; exit 2 ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build the release tarball + checksums
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: bash scripts/build-release.sh "$TAG" dist

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/another-agent-skills-*.tar.gz

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            "dist/another-agent-skills-${TAG}.tar.gz" \
            dist/checksums.txt \
            dist/bootstrap.sh \
            --title "$TAG" \
            --generate-notes

