# npm-publish.yml — publish the npm wrapper (npm/) via OIDC Trusted Publishing.
# Part of another-agent-skills (github.com/juandelossantos/another-agent-skills)
#
# Phase 9 / P9.5. npm retired classic publish tokens; the recommended CI path is
# Trusted Publishing (OIDC). npm requires the package to EXIST before a trusted
# publisher can be configured, so the FIRST publish is manual — a maintainer runs
# it once from npm/ (e.g. `npm publish --access public` after `npm login`). Then
# configure the trusted publisher:
#
#   npmjs.com → the package → Settings → Trusted Publisher → GitHub Actions
#     Organization or user:  juandelossantos
#     Repository:            another-agent-skills
#     Workflow filename:     npm-publish.yml
#     Environment:           npm-release
#
# After that, this workflow publishes with a short-lived OIDC token — NO stored
# npm token. Provenance is generated automatically under OIDC (do not pass the
# provenance flag). It publishes ONLY: no install/test/build steps run here, to
# keep the supply-chain surface minimal. The npm-release environment can be
# gated by required reviewers (see docs/BRANCH-PROTECTION.md).
#
# Publishing is STAGED: this workflow runs `npm stage publish` (never a direct
# `npm publish`). The trusted publisher has "Allow npm publish" UNCHECKED, so a
# direct publish is rejected by design. After the CI stages the package, a
# maintainer reviews and approves it with 2FA (npmjs.com → Staged Packages →
# Approve) before it goes live. Staged publishing needs npm >= 11.15.0.

name: npm-publish

on:
  workflow_dispatch:
  workflow_call:
  release:
    types: [published]

# Least privilege: read the repo, mint an OIDC token. No npm token secret.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # Gated environment: add required reviewers in repo Settings → Environments.
    environment: npm-release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify npm CLI supports staged publishing (>= 11.15.0)
        run: |
          set -euo pipefail
          have="$(npm --version)"
          echo "npm ${have}"
          oldest="$(printf '11.15.0\n%s\n' "$have" | sort -V | head -n1)"
          if [ "$oldest" != "11.15.0" ]; then
            echo "npm ${have} is older than 11.15.0 — staged publishing unavailable" >&2
            exit 1
          fi

      - name: Sync package.json version from VERSION
        run: |
          set -euo pipefail
          V="$(tr -d '[:space:]' < VERSION)"
          node -e "const fs=require('fs');const p='npm/package.json';const j=JSON.parse(fs.readFileSync(p));j.version=process.argv[1];fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n')" "$V"
          echo "npm package version = ${V}"

      - name: Skip if this version is already on npm
        id: check
        run: |
          set -euo pipefail
          V="$(node -p "require('./npm/package.json').version")"
          if npm view "@juandelossantos/another-agent-skills@${V}" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "@juandelossantos/another-agent-skills@${V} already exists — nothing to publish."
          fi

      # Staged: submit to the staging area (a maintainer approves with 2FA).
      - name: Stage the package for review (OIDC)
        if: steps.check.outputs.already != 'true'
        working-directory: npm
        run: npm stage publish
