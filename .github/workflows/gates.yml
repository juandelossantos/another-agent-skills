# gates.yml — Remote Enforcement (L2 authority layer)
# Part of another-agent-skills (github.com/juandelossantos/another-agent-skills)
#
# Runs the REAL gates on every pull request and every push to main. Local hooks
# (.git/hooks/*) are fast feedback for a cooperative agent, but they are
# writable — `core.hooksPath` can be repointed, hooks can be edited. This
# workflow is the authority: it lives in the repo but is enforced by GitHub,
# and the "gates" job is the required status check configured by
# scripts/setup-branch-protection.sh.
#
# Design constraints: no network dependencies beyond the checkout action, and
# no writes (never push, never commit). Read-only. If a gate fails, the PR
# cannot merge.
#
# Spec: PLAN.md — Phase 8 / P8.2

name: gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least privilege: the gates only read the repository.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Gates run on the PR head (what the human approved), not the merge
          # commit. On push to main this resolves to github.sha.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Approval binding (L2, pull_request only)
        if: github.event_name == 'pull_request'
        env:
          # Passed via env (never interpolated into `run:`) to avoid script
          # injection from the PR body.
          PR_BODY: ${{ github.event.pull_request.body }}
        run: bash scripts/check-approved-tree.sh

      - name: TDD gate — every code change needs a test
        run: bash scripts/tdd-gate.sh

      - name: Project test suite
        run: bash tests/run-all.sh

      - name: Skill lint
        run: bash scripts/skill-lint.sh skills/

      - name: Progress skill-table validation
        run: bash scripts/validate-skill-table.sh

      - name: Gate-remedy paths installed (B15 guard)
        run: bash scripts/check-gate-remedies.sh

      # Stock macOS ships bash 3.2. The installer, the CLI and the hooks run on
      # it, so a bash 4-only construct that passes every Linux test is still a
      # crash on a real Mac. Static guard first, then the real interpreter.
      - name: bash 3.2 compatibility (static guard)
        run: bash scripts/check-bash32.sh

      - name: bash 3.2 compatibility (entrypoints in a real bash:3.2)
        run: bash tests/test-bash32-smoke.sh

      # BSD/macOS userland: `grep -P`, bare `sed -i`, `date -d`, `readlink -f`
      # are GNU-only. Inside `$( ... || true )` they fail silently, so a gate
      # reads empty values and blocks forever (Gate 11 on a Mac).
      - name: Portability (GNU vs BSD userland)
        run: bash scripts/check-portability.sh

      - name: Shell syntax check (scripts + hooks)
        run: |
          set -uo pipefail
          fail=0
          for f in scripts/*.sh scripts/git-hooks/*; do
            [ -f "$f" ] || continue
            case "$f" in *.md) continue ;; esac
            if bash -n "$f"; then
              echo "  ok: $f"
            else
              echo "  syntax error: $f"
              fail=1
            fi
          done
          exit "$fail"
